name: "Build"
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  build-omp-launcher:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v5

      - name: Setup NSIS
        run: |
          scoop bucket add extras
          scoop install extras/nsis

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Install frontend dependencies
        run: yarn install

      - name: Install rust i686-pc-windows-msvc target
        run: rustup target add i686-pc-windows-msvc

      - name: Build project
        run: yarn release

      # - name: Generate artifact name
      #   id: vars
      #   shell: bash
      #   run: |
      #     artifact_name="open.mp-launcher-win-${GITHUB_RUN_ID}"
      #     echo "artifact_name=${artifact_name}" >> $GITHUB_OUTPUT
      #     setup_artifact_name="open.mp-launcher-win-setup-${GITHUB_RUN_ID}"
      #     echo "setup_artifact_name=${setup_artifact_name}" >> $GITHUB_OUTPUT

      - name: Prepare launcher artifact
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "src-tauri/target/i686-pc-windows-msvc/release/omp-launcher.exe" `
            -Destination "omp-launcher.exe" `
            -Force

      - name: Upload launcher
        uses: actions/upload-artifact@v7
        with:
          path: omp-launcher.exe
          if-no-files-found: error
          archive: false

      - name: Make NSIS archive
        run: yarn installer

      - name: Prepare installer artifact
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "src-tauri/nsis/omp-launcher-setup.exe" `
            -Destination "omp-launcher-setup.exe" `
            -Force

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: omp-launcher-setup.exe
          if-no-files-found: error
          archive: false
